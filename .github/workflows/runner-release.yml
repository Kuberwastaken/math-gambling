name: Release portable runner
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: runner-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      MG_RUNNER_ARCHIVE: dist/math-gambling/downloads/math-gambling-runner.zip
      MG_HTTP_FIXTURE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --user-agent='OpenAI File Downloader, XaiImageApiFetch/1.0'
      - run: python tools/build_site.py
      - name: Check exact arithmetic, spawn, resume, banking, seed logs and coverage
        run: python -m unittest discover -s tests -p 'test_runner*.py' -v
      - name: Check exact shell pruning against frozen baseline
        run: |
          python -m unittest discover -s tests -p test_shell_pruning.py -v
          node --test tests/test_shell_pruning.mjs
      - name: Check mathematical positive fixtures and independent search kernel
        run: python -m unittest discover -s tests -p test_search.py -v
  release:
    if: github.event.repository.private == false
    needs: compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --user-agent='OpenAI File Downloader, XaiImageApiFetch/1.0'
      - run: python tools/build_site.py
      - name: Package the tested tag and checksum
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          meta = json.loads(pathlib.Path('data/runner-release.json').read_text())
          assert os.environ['GITHUB_REF_NAME'] == 'v' + meta['version'], 'Tag must match runner metadata'
          out = pathlib.Path('release-assets')
          out.mkdir()
          name = 'math-gambling-runner-v' + meta['version'] + '.zip'
          archive = out / name
          shutil.copyfile('dist/math-gambling/downloads/math-gambling-runner.zip', archive)
          (out / 'SHA256SUMS.txt').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + name + '\n')
          shutil.copyfile('docs/RUNNER_SETUP.md', out / 'RUNNER_SETUP.md')
          shutil.copyfile('data/runner-release.json', out / 'runner-release.json')
          PY
      - name: Publish versioned runner after all three platforms pass
        run: python tools/publish_runner_release.py
