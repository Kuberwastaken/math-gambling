<text x="317.5" y="598" text-anchor="middle" font-size="12">Verified tasks at evaluation end</text>
<text x="655" y="390" font-size="19">Exact square tests</text>
<path d="M655 555.00h505" stroke="#ddd"/><text x="646" y="560.00" text-anchor="end" font-size="12">-2.6%</text>
<path d="M655 492.87h505" stroke="#ddd"/><text x="646" y="497.87" text-anchor="end" font-size="12">0.0%</text>
