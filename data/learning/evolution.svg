<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Spatial challenger: prediction error across frozen evaluations</title>
<desc id="desc">Percentage error reduction relative to the proof-aware context baseline. Positive is better. Black is later submitted tasks; red dashed is unseen geometry. This measures predictions, not discovery odds.</desc>
