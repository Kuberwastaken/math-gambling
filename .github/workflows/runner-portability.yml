name: Portable runner compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/runner.py'
      - 'tools/search_core.py'
      - 'tools/client_audit.py'
      - 'tools/coverage_client.py'
      - 'tools/build_site.py'
      - 'tools/render_research.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/test_runner_portability.py'
      - 'tests/test_runner_client.py'
      - 'data/runner-release.json'
      - 'docs/RUNNER_SETUP.md'
      - '.github/workflows/runner-portability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-runner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      MG_RUNNER_ARCHIVE: dist/math-gambling/downloads/math-gambling-runner.zip
      MG_HTTP_FIXTURE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned site-build dependencies
        run: npm ci --ignore-scripts --user-agent='OpenAI File Downloader, XaiImageApiFetch/1.0'
      - name: Build the actual portable download
        run: python tools/build_site.py
      - name: Test spawn, checkpoint resume, locking, links and extracted ZIP
        run: python -m unittest discover -s tests -p 'test_runner*.py' -v
