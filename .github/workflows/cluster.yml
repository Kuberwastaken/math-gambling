name: Verify community compute

on:
  # Settle banks in batches on a cadence instead of one heavy run per issue.
  # A new [bank]/[compute] issue is drained by the next scheduled run (<=10 min),
  # or immediately via workflow_dispatch. collect_issues keeps a durable poll
  # cursor, so each run drains up to MAX_RECEIPTS pending banks in one publish.
  schedule:
    # The whole run (overlay + ingest + learning + reports + publish) grew to
    # ~29 min as the ledger passed 585k tasks, so a 10-min cadence stacked runs
    # that never reached the publish step. Space to 30 min so each run finishes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: community-receipt-ledger
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Whole-run budget. Ingest rescans the full receipt ledger on startup, so
    # overlay+replay alone is ~17 min at 585k tasks; 45 min keeps the publish
    # step reachable with headroom. The durable fix is incremental processing
    # off git (docs/INCREMENTAL_CLUSTER.md) before this budget is threatened again.
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Overlay the authoritative data branch without checking out its code
        run: python3 tools/branch_state.py overlay --fetch
      - name: Restore the Rust kernel build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: verifier-kernel-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/src/**', 'native/Cargo.toml') }}
      - name: Build the reviewed Rust replay kernel from main
        env:
          CARGO_HTTP_USER_AGENT: 'OpenAI File Downloader, XaiImageApiFetch/1.0'
        run: python3 tools/build_native.py
      - name: Test verification, aggregation and safe README rendering
        run: |
          python3 -m unittest discover -s tests -p test_native_kernel.py
          python3 -m unittest discover -s tests -p test_replay_pool.py
          python3 -m unittest discover -s tests -p test_cluster.py
          python3 -m unittest discover -s tests -p test_negative_audit.py
          python3 -m unittest discover -s tests -p test_contribution_credit.py
          python3 -m unittest discover -s tests -p test_readme.py
          python3 -m unittest discover -s tests -p test_replay_pool.py
          python3 -m unittest discover -s tests -p test_coverage.py
          python3 -m unittest discover -s tests -p test_geometric_policy.py
          python3 -m unittest discover -s tests -p test_search_features.py
          python3 -m unittest discover -s tests -p test_public_reports.py
          python3 -m unittest discover -s tests -p test_branch_state.py
      - name: Independently replay selected tasks; retain other claims as unverified
        id: replay
        continue-on-error: true
        run: python3 tools/ingest.py --issues --sample-negatives 20 --kernel rust
      - name: Fit frozen spatial challenger and score later arrivals
        id: learning
        continue-on-error: true
        # Reads every verified receipt each run (~570k on 17 Sep, ~130 s); grows
        # with the ledger. Make it incremental before this bound is reached again.
        timeout-minutes: 8
        run: |
          python3 -m unittest discover -s tests -p test_strategy_model.py
          python3 tools/strategy_model.py
      - name: Generate verified reports with trusted main code
        run: |
          python3 tools/aggregate.py
          python3 tools/coverage_index.py --prune-only
          python3 tools/readme_charts.py
          python3 tools/learning_visuals.py
      - name: Export a bounded mathematical coverage increment
        id: geometry
        continue-on-error: true
        run: python3 tools/math_coverage.py --data data --max-tasks 32 --seconds 15
      - name: Publish only generated data and a freshly rendered README
        run: python3 tools/branch_state.py publish-data --push
      - name: Surface operational failure after preserving verified progress
        if: steps.replay.outcome == 'failure'
        run: |
          echo 'Receipt replay had an operational error. Verified progress was committed; affected banks remain pending.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Surface challenger failure without discarding verified coverage
        if: steps.learning.outcome == 'failure'
        run: |
          echo 'Challenger learning failed; existing production policy retained. See learning step logs.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Report deferred mathematical coverage export
        if: always() && steps.geometry.outcome == 'failure'
        run: echo 'Mathematical coverage export was deferred. Verified task coverage remains authoritative; inspect the exporter logs and data/math-coverage/last-error.json.' >> "$GITHUB_STEP_SUMMARY"
