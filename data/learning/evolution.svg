<text x="1160.00" y="333" text-anchor="middle" font-size="12">281,600</text>
<text x="907.5" y="353" text-anchor="middle" font-size="12">Verified tasks at evaluation end</text>
<text x="65" y="390" font-size="19">Curve intervals</text>
<path d="M65 555.00h505" stroke="#ddd"/><text x="56" y="560.00" text-anchor="end" font-size="12">-0.9%</text>
<path d="M65 538.27h505" stroke="#ddd"/><text x="56" y="543.27" text-anchor="end" font-size="12">0.0%</text>
<path d="M65 410.00h505" stroke="#ddd"/><text x="56" y="415.00" text-anchor="end" font-size="12">6.8%</text>
