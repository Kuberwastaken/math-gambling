<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Spatial challenger: prediction error across frozen evaluations</title>
<desc id="desc">Percentage error reduction relative to the proof-aware context baseline. Positive is better. Black is later submitted tasks; red dashed is unseen geometry. This measures predictions, not discovery odds.</desc>
<rect width="1200" height="730" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#111">
<text x="38" y="45" font-size="27">Is the challenger learning?</text>
<text x="38" y="76" font-size="16">2 frozen evaluations · 281,600 training-boundary tasks · SHADOW: no production influence</text>
<path d="M38 105h30" stroke="#111" stroke-width="3"/><text x="78" y="111" font-size="15">Later submitted tasks</text>
<path d="M320 105h30" stroke="#b5222c" stroke-width="3" stroke-dasharray="6 4"/><text x="360" y="111" font-size="15">Unseen geometry</text>
<text x="65" y="145" font-size="19">Server CPU cost</text>
<path d="M65 310.00h505" stroke="#ddd"/><text x="56" y="315.00" text-anchor="end" font-size="12">-0.7%</text>
<path d="M65 293.27h505" stroke="#ddd"/><text x="56" y="298.27" text-anchor="end" font-size="12">0.0%</text>
<path d="M65 165.00h505" stroke="#ddd"/><text x="56" y="170.00" text-anchor="end" font-size="12">5.6%</text>
<polyline points="65.00,188.20 570.00,181.73" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray=""/>
<polyline points="65.00,229.90 570.00,193.88" fill="none" stroke="#b5222c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="65.00" y="333" text-anchor="middle" font-size="12">280,576</text>
<text x="570.00" y="333" text-anchor="middle" font-size="12">281,600</text>
<text x="317.5" y="353" text-anchor="middle" font-size="12">Verified tasks at evaluation end</text>
<text x="655" y="145" font-size="19">Quotient positions</text>
<path d="M655 310.00h505" stroke="#ddd"/><text x="646" y="315.00" text-anchor="end" font-size="12">-2.2%</text>
<path d="M655 293.27h505" stroke="#ddd"/><text x="646" y="298.27" text-anchor="end" font-size="12">0.0%</text>
<path d="M655 165.00h505" stroke="#ddd"/><text x="646" y="170.00" text-anchor="end" font-size="12">16.7%</text>
