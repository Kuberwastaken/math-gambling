name: Verify community compute

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: community-receipt-ledger
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Read the latest ledger
        run: git pull --ff-only
      - name: Test verification and aggregation contracts
        run: python3 -m unittest discover -s tests -p test_cluster.py
      - name: Independently replay bounded receipts
        id: replay
        continue-on-error: true
        run: python3 tools/ingest.py --issues
      - name: Commit verified data without modifying source
        shell: bash
        run: |
          python3 tools/aggregate.py
          git config user.name 'math-gambling verifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/cluster.json data/strategy.json data/receipts
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified community receipts and frozen cost calibration'
            git push
          fi
      - name: Surface operational failure after preserving verified progress
        if: steps.replay.outcome == 'failure'
        run: |
          echo 'Receipt replay had an operational error. Verified progress was committed; affected banks remain pending.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
