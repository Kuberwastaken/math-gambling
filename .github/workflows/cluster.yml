name: Verify community compute

on:
  # Settle banks in batches on a cadence instead of one heavy run per issue.
  # A new [bank]/[compute] issue is drained by the next scheduled run (<=10 min),
  # or immediately via workflow_dispatch. collect_issues keeps a durable poll
  # cursor, so each run drains up to MAX_RECEIPTS pending banks in one publish.
  schedule:
    # The cadence MUST be slower than one run's wall time. With
    # cancel-in-progress:false a faster cron does NOT catch up: runs serialize and
    # the queued backlog makes GitHub cancel the *running* job ("runner has
    # received a shutdown signal") ~13-15 min in, before publish. A healthy run is
    # ~24 min, so fire every 30 min and drain more banks per run (MG_MAX_RECEIPTS),
    # never more often. Throughput is batch size, not fire rate.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: community-receipt-ledger
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Whole-run budget. Ingest rescans the full receipt ledger on startup, so
    # overlay+replay alone is ~17 min at 585k tasks; 45 min keeps the publish
    # step reachable with headroom. The durable fix is incremental processing
    # off git (docs/INCREMENTAL_CLUSTER.md) before this budget is threatened again.
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Enlarge swap so the full-ledger load fits in the 16 GB runner
        # ingest.py and aggregate.py load the whole receipt ledger (698k tasks +
        # 34k banks, ~8.5M task references) into RAM, which now climbs to ~15 GB
        # and pins the 16 GB runner at the OOM edge; the job then dies mid-step
        # with exit 143 / "runner has received a shutdown signal" (this is what
        # froze publishing since 2026-09-20 21:44Z). The work is memory-resident
        # but not CPU-bound (load ~1.0) and /mnt has ~80 GB free, so a large swap
        # file lets the load complete. Durable fix is incremental off-git
        # processing (docs/INCREMENTAL_CLUSTER.md) so the working set stops growing.
        run: |
          sudo fallocate -l 24G /mnt/mg-swapfile
          sudo chmod 600 /mnt/mg-swapfile
          sudo mkswap /mnt/mg-swapfile
          sudo swapon /mnt/mg-swapfile
          echo "swap after enlargement:"; free -h
      - name: Overlay the authoritative data branch without checking out its code
        run: python3 tools/branch_state.py overlay --fetch
      - name: Restore the Rust kernel build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: verifier-kernel-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/src/**', 'native/Cargo.toml') }}
      - name: Build the reviewed Rust replay kernel from main
        env:
          CARGO_HTTP_USER_AGENT: 'OpenAI File Downloader, XaiImageApiFetch/1.0'
        run: python3 tools/build_native.py
      - name: Test verification, aggregation and safe README rendering
        run: |
          python3 -m unittest discover -s tests -p test_native_kernel.py
          python3 -m unittest discover -s tests -p test_replay_pool.py
          python3 -m unittest discover -s tests -p test_cluster.py
          python3 -m unittest discover -s tests -p test_negative_audit.py
          python3 -m unittest discover -s tests -p test_contribution_credit.py
          python3 -m unittest discover -s tests -p test_readme.py
          python3 -m unittest discover -s tests -p test_replay_pool.py
          python3 -m unittest discover -s tests -p test_coverage.py
          python3 -m unittest discover -s tests -p test_geometric_policy.py
          python3 -m unittest discover -s tests -p test_search_features.py
          python3 -m unittest discover -s tests -p test_public_reports.py
          python3 -m unittest discover -s tests -p test_branch_state.py
      - name: Independently replay selected tasks; retain other claims as unverified
        id: replay
        continue-on-error: true
        # Give replay a real budget: at 3 min it timed out every run and verified
        # almost nothing, so the epoch stayed frozen. A killed process cannot
        # publish its in-memory progress, so keep the internal budget safely under
        # the step cap and the step cap well under the whole-run budget, leaving
        # room for aggregate + publish. The durable issue queue and per-bank cursor
        # carry the remainder into the next run without losing claims.
        timeout-minutes: 10
        env:
          MG_SCAN_PAGES: '6'
          MG_MAX_RECEIPTS: '256'
          MG_REPLAY_SECONDS: '480'
          MG_PENDING_REFETCH: '256'
        run: |
          set -o pipefail
          python3 tools/ingest.py --issues --sample-negatives 20 --kernel rust | tee /tmp/replay-summary.json
      # The shadow model is intentionally off the critical verifier path. It
      # scans the full ledger, has no production influence, and is evaluated in
      # a separate daily workflow. Replay can be killed after writing accepted
      # task records but before ingest's final aggregate, so repair the generated
      # snapshot from the authoritative ledger before rendering and publishing.
      - name: Generate verified reports with trusted main code
        run: |
          python3 tools/aggregate.py
          python3 tools/coverage_index.py --prune-only
          python3 tools/readme_charts.py
      - name: Export a bounded mathematical coverage increment
        id: geometry
        continue-on-error: true
        run: python3 tools/math_coverage.py --data data --max-tasks 32 --seconds 15
      - name: Publish only generated data and a freshly rendered README
        run: python3 tools/branch_state.py publish-data --push
      - name: Note bounded replay cutoff (informational; does not fail the run)
        # Replay is deliberately time-bounded: it drains a batch and is cut off by
        # its budget/step cap, and aggregate.py then reconciles cluster/strategy
        # from the authoritative ledger, so a cutoff is the normal, safe case and
        # publishing already succeeded above. Surface it for visibility, but never
        # fail an otherwise-successful publishing run on it (that just makes a
        # healthy run look broken). A real failure of overlay/build/test/aggregate/
        # publish still fails the job on its own.
        if: always() && steps.replay.outcome != 'success'
        run: |
          echo '### Receipt replay was cut off before draining the whole queue' >> "$GITHUB_STEP_SUMMARY"
          echo 'Outcome: `${{ steps.replay.outcome }}`. Expected when the batch exceeds the replay budget; the durable queue and per-bank cursor retain the remainder for the next run.' >> "$GITHUB_STEP_SUMMARY"
          if test -s /tmp/replay-summary.json; then
            echo 'Last verifier summary:' >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 /tmp/replay-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The verifier produced no final summary; inspect the replay step for a runner kill or timeout.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report deferred mathematical coverage export
        if: always() && steps.geometry.outcome == 'failure'
        run: echo 'Mathematical coverage export was deferred. Verified task coverage remains authoritative; inspect the exporter logs and data/math-coverage/last-error.json.' >> "$GITHUB_STEP_SUMMARY"
