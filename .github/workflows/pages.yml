name: Publish math-gambling
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Verify community compute']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Test mathematical kernels and public protocols
        run: |
          node --test tests/*.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build static site at its project subpath
        run: python3 tools/build_site.py
      - name: Validate links and downloadable runner
        run: python3 tools/check_site.py
      - if: github.event.repository.private == false
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/math-gambling
  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
